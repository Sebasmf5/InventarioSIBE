spring:
  application:
    name: InventarioSIBE
  profiles:
    active: dev
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: America/Bogota

jwt:
  secret: ${JWT_SECRET}
  expiration-hours: 8