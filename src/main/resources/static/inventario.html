<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inventario · InventarioSIBE</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="css/custom.css" rel="stylesheet" />
</head>
<body>
  <div class="app-layout">
    <div id="navbar"></div>

    <main class="app-main">
      <div class="container">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
      <div>
        <h2 class="card-title-section mb-1">Gestión de insumos</h2>
        <p class="text-muted small mb-0">Listado completo del inventario</p>
      </div>
      <a href="insumo-form" class="btn btn-teal">
        <i class="bi bi-plus-circle me-1"></i> Nuevo insumo
      </a>
    </div>

    <div id="errorGlobal"></div>
    <div id="toastExito"></div>

    <div class="card app-card">
      <div class="card-body">
        <div class="row g-2 mb-3">
          <div class="col-12 col-md-6">
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-search"></i></span>
              <input type="text" id="filtroNombre" class="form-control"
                     placeholder="Buscar por nombre…" autocomplete="off" />
            </div>
          </div>
          <div class="col-6 col-md-3">
            <select id="filtroTipo" class="form-select">
              <option value="">Todos los tipos</option>
              <option value="MEDICAMENTO">Medicamento</option>
              <option value="INSUMO_MEDICO">Insumo médico</option>
            </select>
          </div>
          <div class="col-6 col-md-3">
            <select id="filtroEstado" class="form-select">
              <option value="">Todos los estados</option>
              <option value="activo">Activos</option>
              <option value="inactivo">Inactivos</option>
            </select>
          </div>
        </div>

        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead>
              <tr>
                <th>Nombre</th>
                <th>Presentación</th>
                <th>Unidad</th>
                <th>Marca</th>
                <th>Tipo</th>
                <th>Stock mín.</th>
                <th>Estado</th>
                <th class="text-end">Acciones</th>
              </tr>
            </thead>
            <tbody id="tablaInsumos">
              <tr><td colspan="8" class="text-center text-muted py-4">Cargando…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/inventario.js"></script>
</body>
</html>
