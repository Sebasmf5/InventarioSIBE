<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registrar movimiento · InventarioSIBE</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="css/custom.css" rel="stylesheet" />
</head>
<body>
  <div class="app-layout">
    <div id="navbar"></div>

    <main class="app-main">
      <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-9">
        <div class="d-flex align-items-center mb-3">
          <a href="dashboard" class="btn btn-link text-teal px-0 me-2"><i class="bi bi-arrow-left"></i> Volver</a>
        </div>
        <h2 class="card-title-section mb-1">Registrar movimiento</h2>
        <p class="text-muted small mb-3">Asistente de 3 pasos: insumo → lote → tipo y cantidad.</p>

        <div id="errorGlobal"></div>
        <div id="formError"></div>

        <!-- Indicador de pasos -->
        <div class="wizard-steps">
          <div class="wizard-step active" id="step1Ind">1. Insumo</div>
          <div class="wizard-step" id="step2Ind">2. Lote</div>
          <div class="wizard-step" id="step3Ind">3. Movimiento</div>
        </div>

        <div class="card app-card">
          <div class="card-body">
            <!-- PASO 1: elegir insumo -->
            <div id="paso1">
              <label class="form-label" for="buscarInsumo">Buscar insumo</label>
              <div class="input-group mb-3">
                <span class="input-group-text"><i class="bi bi-search"></i></span>
                <input type="text" id="buscarInsumo" class="form-control" placeholder="Escriba para filtrar…" autocomplete="off" />
              </div>
              <div class="list-group" id="listaInsumos" style="max-height: 320px; overflow:auto;">
                <div class="text-center text-muted py-4">Cargando…</div>
              </div>
            </div>

            <!-- PASO 2: elegir lote -->
            <div id="paso2" class="d-none">
              <button class="btn btn-sm btn-link text-teal px-0 mb-2" id="btnVolverPaso1"><i class="bi bi-arrow-left"></i> Cambiar insumo</button>
              <div class="mb-2" id="loteInsumoNombre"></div>
              <div class="list-group" id="listaLotes" style="max-height: 320px; overflow:auto;">
                <div class="text-center text-muted py-4">Cargando lotes…</div>
              </div>
            </div>

            <!-- PASO 3: tipo y cantidad -->
            <div id="paso3" class="d-none">
              <button class="btn btn-sm btn-link text-teal px-0 mb-3" id="btnVolverPaso2"><i class="bi bi-arrow-left"></i> Cambiar lote</button>
              <div class="row g-3">
                <div class="col-12">
                  <label class="form-label">Lote seleccionado</label>
                  <div id="loteSeleccionado" class="p-3 rounded border bg-light"></div>
                </div>
                <div class="col-12 col-md-6">
                  <label class="form-label" for="tipoMov">Tipo de movimiento *</label>
                  <select id="tipoMov" class="form-select">
                    <option value="SALIDA">Salida</option>
                    <option value="ENTRADA">Entrada</option>
                  </select>
                </div>
                <div class="col-12 col-md-6">
                  <label class="form-label" for="cantidad">Cantidad *</label>
                  <input type="number" id="cantidad" class="form-control" min="1" required />
                  <div class="form-text" id="hintCantidad"></div>
                </div>
                <div class="col-12">
                  <label class="form-label" for="observacion">Observación</label>
                  <input type="text" id="observacion" class="form-control" placeholder="Opcional" />
                </div>
              </div>

              <div class="d-flex justify-content-end gap-2 mt-4">
                <a href="dashboard" class="btn btn-outline-secondary">Cancelar</a>
                <button class="btn btn-teal" id="btnConfirmar" type="button">
                  <span id="spinner" class="spinner-border spinner-border-sm me-2 d-none"></span>
                  Confirmar movimiento
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/movimiento-wizard.js"></script>
</body>
</html>
