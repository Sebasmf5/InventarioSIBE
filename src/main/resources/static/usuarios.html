<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Usuarios · InventarioSIBE</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="css/custom.css" rel="stylesheet" />
</head>
<body>
  <div class="app-layout">
    <div id="navbar"></div>

    <main class="app-main">
      <div class="container">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
      <div>
        <h2 class="card-title-section mb-1">Gestión de usuarios</h2>
        <p class="text-muted small mb-0">Solo disponible para SUPERVISOR</p>
      </div>
      <button class="btn btn-teal" id="btnNuevo" type="button">
        <i class="bi bi-person-plus me-1"></i> Nuevo usuario
      </button>
    </div>

    <div id="errorGlobal"></div>
    <div id="toastExito"></div>

    <div class="card app-card">
      <div class="card-body">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead>
              <tr>
                <th>Nombre</th>
                <th>Correo</th>
                <th>Rol</th>
                <th>Estado</th>
              </tr>
            </thead>
            <tbody id="tablaUsuarios">
              <tr><td colspan="4" class="text-center text-muted py-4">Cargando…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal nuevo usuario -->
  <div class="modal fade" id="modalUsuario" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header bg-teal text-white">
          <h5 class="modal-title" id="modalTitulo">Nuevo usuario</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <div id="formError"></div>
          <form id="usuarioForm" novalidate>
            <div class="mb-3">
              <label class="form-label" for="uNombre">Nombre *</label>
              <input type="text" id="uNombre" class="form-control" required />
            </div>
            <div class="mb-3">
              <label class="form-label" for="uEmail">Correo *</label>
              <input type="email" id="uEmail" class="form-control" required />
            </div>
            <div class="mb-3">
              <label class="form-label" for="uPassword">Contraseña *</label>
              <input type="password" id="uPassword" class="form-control" minlength="8" required />
              <div class="form-text">Mínimo 8 caracteres.</div>
            </div>
            <div class="row g-3">
              <div class="col-6">
                <label class="form-label" for="uRol">Rol *</label>
                <select id="uRol" class="form-select">
                  <option value="ENFERMERIA">Enfermería</option>
                  <option value="SUPERVISOR">Supervisor</option>
                </select>
              </div>
              <div class="col-6 d-flex align-items-end">
                <div class="form-check form-switch">
                  <input class="form-check-input" type="checkbox" id="uActivo" checked />
                  <label class="form-check-label" for="uActivo">Activo</label>
                </div>
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-teal" id="btnGuardar">Guardar</button>
        </div>
      </div>
    </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/usuarios.js"></script>
</body>
</html>
