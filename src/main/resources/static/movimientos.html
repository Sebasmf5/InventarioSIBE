<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Movimientos · InventarioSIBE</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="css/custom.css" rel="stylesheet" />
</head>
<body>
  <div class="app-layout">
    <div id="navbar"></div>

    <main class="app-main">
      <div class="container">
        <!-- Encabezado: cambia según si es panel general o vista por lote -->
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
          <div>
            <h2 class="card-title-section mb-1" id="tituloPagina">Movimientos</h2>
            <p class="text-muted small mb-0" id="subtituloPagina">Bitácora general de movimientos de inventario</p>
          </div>
          <a href="lotes" class="btn btn-link text-teal px-0">
            <i class="bi bi-arrow-left"></i> Volver a lotes
          </a>
        </div>

        <div id="errorGlobal"></div>
        <div id="toastExito"></div>

        <!-- Filtros -->
        <div class="card app-card mb-3">
          <div class="card-body">
            <div class="row g-2">
              <div class="col-12 col-md-4">
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-search"></i></span>
                  <input type="text" id="filtroInsumo" class="form-control"
                         placeholder="Buscar por insumo…" autocomplete="off" />
                </div>
              </div>
              <div class="col-6 col-md-3">
                <select id="filtroTipo" class="form-select">
                  <option value="">Todos los tipos</option>
                  <option value="ENTRADA">Entradas</option>
                  <option value="SALIDA">Salidas</option>
                </select>
              </div>
              <div class="col-6 col-md-3">
                <select id="filtroLote" class="form-select">
                  <option value="">Todos los lotes</option>
                </select>
              </div>
              <div class="col-12 col-md-2">
                <select id="filtroUsuario" class="form-select">
                  <option value="">Todos los usuarios</option>
                </select>
              </div>
            </div>
          </div>
        </div>

        <!-- Tabla de movimientos -->
        <div class="card app-card">
          <div class="card-body">
            <div class="table-responsive">
              <table class="table table-hover align-middle mb-0">
                <thead>
                  <tr>
                    <th>Fecha</th>
                    <th>Tipo</th>
                    <th>Insumo</th>
                    <th>Lote</th>
                    <th>Cantidad</th>
                    <th>Usuario</th>
                    <th>Observación</th>
                  </tr>
                </thead>
                <tbody id="tablaMovimientos">
                  <tr><td colspan="7" class="text-center text-muted py-4">Cargando…</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/movimientos.js"></script>
</body>
</html>
