<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Insumo · InventarioSIBE</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="css/custom.css" rel="stylesheet" />
</head>
<body>
  <div class="app-layout">
    <div id="navbar"></div>

    <main class="app-main">
      <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-8">
        <div class="d-flex align-items-center mb-3">
          <a href="inventario" class="btn btn-link text-teal px-0 me-2"><i class="bi bi-arrow-left"></i> Volver</a>
        </div>
        <h2 class="card-title-section mb-3" id="tituloForm">Nuevo insumo</h2>

        <div id="errorGlobal"></div>
        <div id="formError"></div>

        <div class="card app-card">
          <div class="card-body">
            <form id="insumoForm" novalidate>
              <div class="row g-3">
                <div class="col-12 col-md-8">
                  <label class="form-label" for="nombre">Nombre *</label>
                  <input type="text" id="nombre" class="form-control" required />
                </div>
                <div class="col-6 col-md-4">
                  <label class="form-label" for="tipo">Tipo *</label>
                  <select id="tipo" class="form-select" required>
                    <option value="MEDICAMENTO">Medicamento</option>
                    <option value="INSUMO_MEDICO">Insumo médico</option>
                  </select>
                </div>
                <div class="col-12 col-md-6">
                  <label class="form-label" for="presentacion">Presentación *</label>
                  <input type="text" id="presentacion" class="form-control" required />
                </div>
                <div class="col-6 col-md-3">
                  <label class="form-label" for="unidadMedida">Unidad de medida *</label>
                  <input type="text" id="unidadMedida" class="form-control" required placeholder="ej. ml, mg, uds" />
                </div>
                <div class="col-6 col-md-3">
                  <label class="form-label" for="stockMinimo">Stock mínimo *</label>
                  <input type="number" id="stockMinimo" class="form-control" min="0" value="0" required />
                </div>
                <div class="col-12 col-md-6">
                  <label class="form-label" for="marca">Marca *</label>
                  <input type="text" id="marca" class="form-control" required />
                </div>
                <div class="col-12 col-md-6">
                  <label class="form-label" for="registroInvima">Registro INVIMA</label>
                  <input type="text" id="registroInvima" class="form-control" placeholder="Opcional" />
                </div>
                <div class="col-12">
                  <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" id="activo" checked />
                    <label class="form-check-label" for="activo">Activo</label>
                  </div>
                </div>
              </div>

              <div class="d-flex justify-content-end gap-2 mt-4">
                <a href="inventario" class="btn btn-outline-secondary">Cancelar</a>
                <button type="submit" class="btn btn-teal" id="btnGuardar">
                  <span id="spinner" class="spinner-border spinner-border-sm me-2 d-none"></span>
                  Guardar
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/insumo-form.js"></script>
</body>
</html>
