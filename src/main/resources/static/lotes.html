<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lotes · InventarioSIBE</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="css/custom.css" rel="stylesheet" />
</head>
<body>
  <div class="app-layout">
    <div id="navbar"></div>

    <main class="app-main">
      <div class="container">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
      <div>
        <h2 class="card-title-section mb-1">Gestión de lotes</h2>
        <p class="text-muted small mb-0">Listado completo de lotes con su estado de semáforo y de actividad</p>
      </div>
      <a href="lote-form" class="btn btn-teal">
        <i class="bi bi-plus-circle me-1"></i> Registrar lote
      </a>
    </div>

    <div id="errorGlobal"></div>
    <div id="toastExito"></div>

    <div class="card app-card">
      <div class="card-body">
        <div class="row g-2 mb-3">
          <div class="col-12 col-md-4">
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-search"></i></span>
              <input type="text" id="filtroLote" class="form-control"
                     placeholder="Buscar por número de lote…" autocomplete="off" />
            </div>
          </div>
          <div class="col-6 col-md-3">
            <select id="filtroInsumo" class="form-select">
              <option value="">Todos los insumos</option>
            </select>
          </div>
          <div class="col-6 col-md-3">
            <select id="filtroSemaforo" class="form-select">
              <option value="">Todos los estados</option>
              <option value="Vigente">Vigentes</option>
              <option value="Por vencer">Por vencer</option>
              <option value="Crítico">Críticos</option>
              <option value="Agotado">Agotados</option>
            </select>
          </div>
          <div class="col-12 col-md-2">
            <select id="filtroActivo" class="form-select">
              <option value="">Activos e inactivos</option>
              <option value="activo">Solo activos</option>
              <option value="inactivo">Solo inactivos</option>
            </select>
          </div>
        </div>

        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead>
              <tr>
                <th>Insumo</th>
                <th>Nº de lote</th>
                <th>Vencimiento</th>
                <th>Días</th>
                <th>Cant. inicial</th>
                <th>Cant. actual</th>
                <th>Ubicación</th>
                <th>Semáforo</th>
                <th>Estado</th>
                <th class="text-end">Acción</th>
              </tr>
            </thead>
            <tbody id="tablaLotes">
              <tr><td colspan="10" class="text-center text-muted py-4">Cargando…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/lotes.js"></script>
</body>
</html>
