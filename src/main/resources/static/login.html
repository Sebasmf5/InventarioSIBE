<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión · InventarioSIBE</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="css/custom.css" rel="stylesheet" />
</head>
<body>
  <div class="login-wrap">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-md-5">
          <div class="card login-card">
            <div class="card-body p-4 p-md-5">
              <div class="text-center mb-4">
                <i class="bi bi-boxes fs-1 text-teal"></i>
                <h1 class="login-brand h3 mb-1">InventarioSIBE</h1>
                <p class="text-muted small mb-0">Control de insumos y lotes</p>
              </div>

              <div id="formError"></div>

              <form id="loginForm" novalidate>
                <div class="mb-3">
                  <label for="email" class="form-label">Correo electrónico</label>
                  <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" id="email" name="email" class="form-control"
                           placeholder="usuario@correo.com" required autocomplete="username" />
                  </div>
                </div>

                <div class="mb-3">
                  <label for="password" class="form-label">Contraseña</label>
                  <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" id="password" name="password" class="form-control"
                           placeholder="••••••••" required autocomplete="current-password" />
                    <button class="btn btn-outline-secondary" type="button" id="btnTogglePass" tabindex="-1">
                      <i class="bi bi-eye" id="iconTogglePass"></i>
                    </button>
                  </div>
                </div>

                <button type="submit" class="btn btn-teal w-100 py-2 fw-semibold" id="btnLogin">
                  <span id="spinner" class="spinner-border spinner-border-sm me-2 d-none"></span>
                  Ingresar
                </button>
              </form>
            </div>
          </div>
          <p class="text-center text-white-50 small mt-3">InventarioSIBE · Sistema de gestión</p>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
